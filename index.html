['botas_aco','GREVAS','Grevas de Aço','botas',0,'t','aco','Firmes no chão, prontas para a primeira batalha.','O atrito depende das superfícies em contato: uma sola áspera segura melhor que uma lisa.',['O que aumenta o atrito entre a bota e o chão?','Uma sola mais áspera','Um chão encerado','Uma sola lisa'],{pts:ARM_PTS.aco}],
['elmo','ELMO','Elmo de Bronze','cabeca',1,'t','bronze','Forjado nas oficinas da Cidadela das Mil Torres, onde todo herói começa.','Em queda livre perto da Terra, a velocidade aumenta cerca de 10 m/s a cada segundo (g ≈ 10 m/s²).',['Algo cai do repouso por 3 s (g = 10 m/s²). Sua velocidade é:','30 m/s','10 m/s','3 m/s'],{pts:ARM_PTS.bronze}],
['armadura','ARMADURA','Peitoral de Bronze','peito',1,'t','bronze','Pesada, firme e confiável como a primeira lei de Newton.','Inércia: um corpo tende a manter seu estado de repouso ou de movimento se a força resultante for nula.',['Por que você é jogado para a frente quando o ônibus freia?','Inércia','Atrito','Empuxo'],{pts:ARM_PTS.bronze}],
['botas_bronze','GREVAS','Grevas de Bronze','botas',1,'t','bronze','Pesadas, mas nunca escorregam.','Dilatação térmica: os metais aumentam de tamanho quando esquentam. Por isso trilhos e pontes têm pequenas folgas.',['Por que os trilhos de trem têm folgas entre as barras?','Para o metal dilatar no calor','Para economizar metal','Para o trem fazer barulho'],{pts:ARM_PTS.bronze}],
['elmo_prata','ELMO','Elmo de Prata','cabeca',2,'t','prata','Polido até refletir as estrelas.','A prata é o metal que melhor conduz eletricidade e calor. O cobre vem logo atrás e é bem mais barato, por isso é o dos fios.',['Qual metal conduz eletricidade melhor que todos?','Prata','Ferro','Alumínio'],{pts:ARM_PTS.prata}],
['arm_prata','PEITORAL','Peitoral de Prata','peito',2,'t','prata','Um espelho de batalha: devolve a luz para quem a lançou.','Lei da reflexão: o ângulo de incidência é igual ao de reflexão. Os espelhos antigos eram feitos com uma camada de prata.',['Um raio chega a um espelho plano a 30° da normal. Ele reflete a:','30° da normal','60° da normal','90° da normal'],{pts:ARM_PTS.prata}],
['botas_prata','GREVAS','Grevas de Prata','botas',2,'t','prata','Pousam leves mesmo depois do salto mais alto.','Impulso: ao dobrar os joelhos na aterrissagem, você aumenta o tempo da freada e diminui a força sobre o corpo.',['Por que dobramos os joelhos ao cair de um salto?','Aumenta o tempo e reduz a força','Aumenta a gravidade','Diminui a massa'],{pts:ARM_PTS.prata}],
['elmo_cristal','ELMO','Elmo de Elétrum','cabeca',2,'t','eletro','Prata clara com aletas de ouro.','Elétrum é uma liga natural de ouro e prata. Os gregos chamavam o âmbar de "elektron", e daí veio a palavra elétron.',['A palavra "elétron" vem do grego "elektron", que significa...','Âmbar','Raio','Metal'],{pts:ARM_PTS.eletro}],
['arm_cristal','ARMADURA','Armadura de Elétrum','peito',2,'t','eletro','Dizem que ela atrai faíscas como o âmbar atrai papel.','Esfregue um pente no cabelo e ele atrai papelzinhos: é a eletrização por atrito.',['Um pente atritado no cabelo atrai papel porque...','Fica eletrizado','Fica magnético','Esquenta'],{pts:ARM_PTS.eletro}],

const PDI=new WeakMap();
function pdIndex(p){let ix=PDI.get(p);if(ix)return ix;const C=3,m=new Map();for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],x0=Math.floor(Math.min(a[0],b[0])/C),x1=Math.floor(Math.max(a[0],b[0])/C),y0=Math.floor(Math.min(a[1],b[1])/C),y1=Math.floor(Math.max(a[1],b[1])/C);for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const k=gx*100003+gy;let l=m.get(k);if(!l)m.set(k,l=[]);l.push(i)}}ix={C,m};PDI.set(p,ix);return ix}
function segD2(X,Y,a,b,m2){const ax=a[0],ay=a[1],bx=b[0],by=b[1];let ex=0,ey=0;if(X<ax&&X<bx)ex=(ax<bx?ax:bx)-X;else if(X>ax&&X>bx)ex=X-(ax>bx?ax:bx);if(Y<ay&&Y<by)ey=(ay<by?ay:by)-Y;else if(Y>ay&&Y>by)ey=Y-(ay>by?ay:by);if(ex*ex+ey*ey>=m2)return m2;const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?((X-ax)*dx+(Y-ay)*dy)/L:0;t=t<0?0:t>1?1:t;const qx=X-ax-t*dx,qy=Y-ay-t*dy,d2=qx*qx+qy*qy;return d2<m2?d2:m2}

function update(dt){
